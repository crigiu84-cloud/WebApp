<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styleLogin.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <title>WebApp - Registrazione</title>
    </head>
    <body>
        <div class="auth-card">
            <div class="brand-header">
                <img src="immagini/logoSenzaSfondo.png" alt="Login Icon" class="logo-vault">
                <span class="brand-title">VAULT</span>
            </div>

            <div class="box-login">
                <h2 id="auth-title">Registrazione</h2>        
                <form id="auth-form">
                    <div class="input-group">
                        <label for="username-text">Username</label>
                        <input type="text" id="username-text" placeholder="Crea un username" required>
                    </div>

                    <div class="input-group">
                        <label for="password-text">Password</label>                        
                        <input type="password" id="password-text" placeholder="Crea una password sicura" oninput="validaPasswordInTempoReale()" required>
                    </div>

                    <div class="password-requirements" style="font-size: 0.85rem; margin-top: 8px; margin-bottom: 15px;">
                        <p id="req-length" style="color: #ef4444; margin: 3px 0;">✖ Almeno 8 caratteri</p>
                        <p id="req-upper" style="color: #ef4444; margin: 3px 0;">✖ Almeno una lettera maiuscola</p>
                        <p id="req-lower" style="color: #ef4444; margin: 3px 0;">✖ Almeno una lettera minuscola</p>
                        <p id="req-number" style="color: #ef4444; margin: 3px 0;">✖ Almeno un numero</p>
                        <p id="req-special" style="color: #ef4444; margin: 3px 0;">✖ Almeno un carattere speciale</p>
                        <p id="req-space" style="color: #22c55e; margin: 3px 0;">✔ Nessun spazio presente</p>
                    </div>

                    <div class="buttons-container">
                        <button type="button" onclick="gestisciRegistrazione()" id="btn-register-confirm" class="btn-primary">Crea Account</button>
                        <button type="button" onclick="window.location.href='login.html'" class="btn-secondary">Torna al Login</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="js/auth.js"></script>
    </body>
</html>
